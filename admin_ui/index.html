<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We Are Close — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
  <main id="login-view" class="login-shell">
    <form id="login-form" class="card login-card shadow-sm">
      <div class="card-body p-4">
        <div class="brand-mark mb-3">WAC</div>
        <h1 class="h3 mb-1">Админ-панель</h1>
        <p class="text-secondary mb-4">We Are Close</p>
        <div id="login-error" class="alert alert-danger d-none"></div>
        <label class="form-label" for="email">Email</label>
        <input class="form-control mb-3" id="email" name="email" type="email" required autocomplete="username">
        <label class="form-label" for="password">Пароль</label>
        <input class="form-control mb-4" id="password" name="password" type="password" required autocomplete="current-password">
        <button class="btn btn-primary w-100" type="submit">Войти</button>
      </div>
    </form>
  </main>

  <div id="app-view" class="d-none">
    <nav class="navbar navbar-dark bg-primary sticky-top">
      <div class="container-fluid">
        <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><span class="navbar-toggler-icon"></span></button>
        <span class="navbar-brand mb-0 h1">We Are Close Admin</span>
        <div class="d-flex align-items-center gap-3 text-white"><span id="admin-name" class="small"></span><button id="logout" class="btn btn-outline-light btn-sm">Выйти</button></div>
      </div>
    </nav>
    <div class="container-fluid">
      <div class="row">
        <aside id="sidebar" class="sidebar col-lg-2 offcanvas-lg offcanvas-start bg-white border-end p-0" tabindex="-1">
          <div class="offcanvas-header border-bottom"><h5 class="offcanvas-title">Разделы</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
          <div class="offcanvas-body p-2">
            <div class="nav nav-pills flex-column gap-1" id="nav-items"></div>
            <hr>
          </div>
        </aside>
        <section class="col-lg-10 ms-auto content-area">
          <div id="flash" class="alert d-none"></div>
          <div id="page-content"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="modal fade" id="action-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><form id="action-form" class="modal-content">
      <div class="modal-header"><h5 id="action-title" class="modal-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div id="action-fields" class="modal-body"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button><button class="btn btn-primary" type="submit">Подтвердить</button></div>
    </form></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
